<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Consumi Carburante</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="description" content="Tieni sotto controllo rifornimenti, consumi e spese del tuo veicolo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consumi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 id="title">Consumi</h1>
    <button class="vehicle-chip" id="vehicleChip" aria-label="Cambia veicolo"></button>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<button class="fab" id="fab" aria-label="Aggiungi rifornimento">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabbar" id="tabbar">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Riepilogo</span></button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Storico</span></button>
  <button data-tab="charts"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg><span>Grafici</span></button>
  <button data-tab="trip"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Itinerario</span></button>
  <button data-tab="vehicle"><svg viewBox="0 0 24 24"><path d="M5 16l1.5-6h11L19 16M3 16h18v3H3zM7 19v1.5M17 19v1.5"/></svg><span>Veicolo</span></button>
</nav>
<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
